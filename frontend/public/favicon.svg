<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fx-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fx-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="fx-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M 32 4 L 54 13 C 54 36 44 51 32 60 C 20 51 10 36 10 13 Z" fill="url(#fx-shield)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Inner Cyber Scan Line -->
  <path d="M 16 17 L 32 10 L 48 17 C 48 35 40 47 32 54 C 24 47 16 35 16 17 Z" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="3 2" opacity="0.6"/>

  <!-- Forensic Magnifying Reticle & "X" Glyph -->
  <!-- Crosshairs -->
  <line x1="32" y1="18" x2="32" y2="23" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="41" x2="32" y2="46" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="18" y1="32" x2="23" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="32" x2="46" y2="32" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Stylized "X" with glowing nodes -->
  <line x1="24" y1="24" x2="40" y2="40" stroke="url(#fx-cyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#fx-glow)"/>
  <line x1="40" y1="24" x2="24" y2="40" stroke="url(#fx-cyan)" stroke-width="3.5" stroke-linecap="round" filter="url(#fx-glow)"/>

  <!-- Forensic Center Core -->
  <circle cx="32" cy="32" r="3.5" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5" />
</svg>